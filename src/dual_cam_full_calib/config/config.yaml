# dual_cam_full_calib configuration
# All parameters are optional; defaults match the original spec values.

# --- Point cloud topic names ---
cam1_topic: "/cam1/points"
cam2_topic: "/cam2/points"

# --- VoxelGrid down-sampling ---
voxel_leaf_size: 0.05          # metres, applied equally to x/y/z

# --- ICP parameters ---
icp_max_iterations: 50
icp_transformation_epsilon: 1.0e-8
icp_max_correspondence_distance: 0.5   # metres

# --- Calibration thresholds ---
min_pivot_samples: 2           # minimum rotation samples (N >= 2)
min_straight_samples: 1        # minimum straight-line samples (M >= 1)

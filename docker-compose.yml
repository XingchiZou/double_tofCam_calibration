services:
  ros-dev:
    build: .
    image: dual-cam-pivot-calib:dev
    network_mode: host
    volumes:
      - ./src:/catkin_ws/src:cached
      - ./scripts:/catkin_ws/scripts:cached
    environment:
      - ROS_MASTER_URI=http://localhost:11311
      - ROS_HOSTNAME=localhost
    command: bash -lc "source /opt/ros/noetic/setup.bash && source /catkin_ws/devel/setup.bash && bash"
